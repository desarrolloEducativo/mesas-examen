<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planes de estudio· Universitas</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, sans-serif; color: #303740; background: #f7f7f8; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { background: white; padding: 10px 20px; border-bottom: 3px solid #28618b; }
    .logo { display: block; width: 100%; max-width: 460px; height: auto; margin: auto; }
    main { max-width: 1080px; margin: auto; padding: 28px 20px 48px; }
    h1 { margin: 0 0 10px; font-size: clamp(1.7rem, 5vw, 2.3rem); color: #163b59; }
    h2, h3 { color: #163b59; }
    p { line-height: 1.6; }
    .ayuda, .muted { color: #526275; }
    .aviso-construccion { padding: 14px 16px; margin: 18px 0; border: 1px solid #e4c573; border-left: 4px solid #ba850c; border-radius: 8px; background: #fff5d8; color: #62460b; line-height: 1.5; }
    .aviso-construccion strong { display: block; margin-bottom: 4px; }
    .comentarios-resolucion { margin: 5px 0; padding: 0; }
    .comentarios-resolucion h3 { margin: 0 0 3px; font-size: .8rem; }
    .comentarios-resolucion summary { cursor: pointer; color: #526275; font-size: .75rem; font-weight: 400; }
    .comentarios-resolucion[open] summary { margin-bottom: 4px; }
    .comentarios-resolucion p { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
    fieldset, article { background: white; border: 1px solid #dce3eb; border-radius: 12px; padding: 20px; margin: 24px 0; min-width: 0; }
    legend, label { font-weight: 600; }
    legend { padding: 0 6px; }
    .filtros { display: grid; grid-template-columns: 1.25fr 2fr 1.5fr; gap: 12px; }
    label { display: grid; gap: 7px; font-size: .9rem; }
    .campo { display: grid; gap: 7px; font-size: .9rem; }
    select, button { font: inherit; min-height: 46px; padding: 10px 12px; border: 1px solid #b8c6d3; border-radius: 7px; background: white; color: #163b59; max-width: 100%; width: 100%; }
    button { width: auto; cursor: pointer; }
    :focus-visible { outline: 3px solid #2676b3; outline-offset: 3px; }
    :disabled { opacity: .65; }
    #estado { margin: 16px 0; }
    article { border-top: 3px solid #28618b; padding: 10px 14px; margin: 10px 0; }
    article p { margin: 6px 0; font-size: .9rem; line-height: 1.4; }
    article h2 { margin: 0; font-size: clamp(1rem, 2vw, 1.15rem); font-weight: 750; line-height: 1.2; }
    .etiqueta { display: inline-block; padding: 4px 10px; border-radius: 20px; background: #edf3f8; color: #163b59; font-size: .85rem; }
    .inactiva { background: #f3eee5; color: #705320; }
    dl { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 5px 12px; margin: 0; }
    .informacion-resolucion { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: stretch; }
    .detalle-resolucion { min-width: 0; }
    .titulo-otorgado { margin-top: 5px; font-size: .9rem; line-height: 1.35; color: #163b59; }
    .nombre-carrera { font-size: clamp(1rem, 2vw, 1.15rem); font-weight: 750; line-height: 1.3; color: #163b59; }
    .encabezado-resolucion { display: grid; gap: 5px; }
    .metadatos-resolucion { display: flex; align-items: center; flex-wrap: wrap; gap: 5px 14px; color: #526275; }
    .resolucion-inline { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; font-size: .82rem; font-weight: 600; color: #28618b; }
    .estado-resolucion { align-self: flex-end; }
    .acciones-estado { display: flex; min-width: 142px; flex-direction: column; align-items: flex-end; justify-content: space-between; gap: 22px; }
    .vigencia-inline { font-size: .78rem; font-weight: 400; color: #526275; white-space: nowrap; }
    .resumen-plan { margin: 4px 0 0; color: #526275; font-size: .82rem; }
    .pdf-icono { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; color: #28618b; border-radius: 4px; }
    .pdf-icono:hover { background: #edf3f8; }
    .pdf-icono svg { width: 19px; height: 19px; }
    .datos-numero { display: block; margin: 0; }
    .numero-resolucion { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    dt { font-size: .7rem; font-weight: 650; color: #526275; letter-spacing: .03em; text-transform: uppercase; }
    dd { margin: 2px 0 0; line-height: 1.25; font-size: .9rem; color: #163b59; }
    dl > div:first-child dd { font-size: clamp(.95rem, 2vw, 1.1rem); font-weight: 750; line-height: 1.25; }
    .pie-plan { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 12px; font-size: .75rem; margin-top: 5px; }
    article .comentarios-resolucion p { font-size: .8rem; line-height: 1.3; }
    .materias-plan { border-top: 1px solid #dce3eb; padding-top: 4px; margin-top: 6px; }
    .tabla { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; table-layout: fixed; line-height: 1.25; }
    caption { text-align: left; padding: 0 0 9px; font-size: 20px; font-weight: 600; color: #163b59; }
    th, td { border: 1px solid #c5cbd2; padding: 9px 7px; text-align: left; vertical-align: top; font-size: 13px; overflow-wrap: anywhere; }
    th { background: #edf3f8; color: #163b59; font-weight: 650; }
    thead th { padding: 10px 8px; vertical-align: middle; line-height: 1.2; overflow-wrap: normal; hyphens: none; }
    thead th:first-child { width: 27%; }
    thead th:nth-child(2) { width: 10%; }
    thead th:nth-child(3) { width: 8%; }
    thead th:nth-child(4) { width: 24%; }
    thead th:nth-child(5) { width: 11%; }
    thead th:nth-child(6) { width: 10%; }
    thead th:last-child { width: 10%; }
    th:nth-child(2), td:nth-child(2), th:nth-child(3), td:nth-child(3), th:nth-child(5), td:nth-child(5), th:nth-child(6), td:nth-child(6), th:nth-child(7), td:nth-child(7) { text-align: center; }
    tbody tr:not(.separador-anio):nth-child(odd) { background: #fafcfd; }
    tbody tr:not(.separador-anio):hover { background: #f3f7fa; }
    .dato-pendiente { color: #6b7280; font-size: .75rem; }
    .separador-anio th { padding: 6px 7px; background: #edf3f8; border-top: 2px solid #c5cbd2; font-size: 13px; }
    ul { margin: 0; padding-left: 18px; }
    li + li { margin-top: 3px; }
    .correlativas { list-style: none; padding-left: 0; }
    .tipo-correlativa { display: inline-block; margin-left: 4px; padding: 0 4px; border: 1px solid #b8cbdc; border-radius: 3px; background: #edf3f8; color: #163b59; font-size: .7rem; font-weight: 700; white-space: nowrap; }
    .leyenda-correlativas { display: block; margin-top: 3px; color: #526275; font-size: .7rem; font-weight: 400; line-height: 1.3; white-space: nowrap; }
    .aclaracion-correlativas { margin-top: 12px; padding-top: 8px; border-top: 1px solid #dce3eb; color: #526275; }
    a { color: #205f90; }
    [hidden] { display: none !important; }
    .acciones { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .boton-secundario { min-height: 28px; padding: 4px 8px; border-color: #dce3eb; background: transparent; color: #526275; font-size: .75rem; border-radius: 5px; }
    .boton-secundario:hover { background: #f5f7f9; color: #163b59; }
    .boton-secundario:disabled { display: none; }
    #impresion { position: absolute; left: -10000px; top: 0; width: 190mm; visibility: hidden; }
    #impresion .logo { width: 65mm; margin: 0 auto 3mm; }
    #impresion article { margin: 0; padding: 3mm; border-radius: 0; }
    #impresion article p, #impresion dd { font-size: 9pt; }
    #impresion dt { font-size: 8pt; }
    #impresion article h2, #impresion .nombre-carrera { font-size: 12pt; }
    #impresion .titulo-otorgado { font-size: 10pt; }
    #impresion caption { font-size: 10pt; padding: 3mm 0 1mm; }
    #impresion table { font-size: 8pt; table-layout: fixed; min-width: 0; }
    #impresion th, #impresion td { padding: 1mm; font-size: 8pt; overflow-wrap: anywhere; min-width: 0; }
    #impresion .tabla { overflow: visible; }
    #impresion .comentarios-resolucion { margin: 2mm 0; padding: 2mm; }
    #impresion .materias-plan { margin-top: 2mm; padding-top: 2mm; }
    #impresion li + li { margin-top: 1mm; }
    #impresion .tipo-correlativa { font-size: 7pt; padding: 0 3px; }
    #impresion .leyenda-correlativas { font-size: 7pt; margin-top: 1mm; }
    #impresion .boton-secundario { display: none; }
    @page { size: A4 portrait; margin: 10mm; }
    @media print {
      body { background: white; }
      body > header, body > main { display: none; }
      #impresion { position: static; visibility: visible; color: black; }
      #impresion article { break-inside: avoid; }
      #impresion a { color: inherit; text-decoration: none; }
    }
    @media (max-width: 650px) {
      main { padding: 20px 12px 32px; }
      .logo { max-width: 280px; }
      .filtros, dl { grid-template-columns: 1fr; }
      .informacion-resolucion { grid-template-columns: 1fr; gap: 14px; }
      .acciones-estado { min-width: 0; flex-direction: row; align-items: center; justify-content: space-between; }
      .estado-resolucion { align-self: center; }
      article, fieldset { padding: 16px; }
      table { min-width: 900px; }
    }
  </style>
</head>
<body>
  <header><img class="logo" src="./logo-universitas.png" alt="Universitas — Nivel Superior, DIEGEP 4031" fetchpriority="high"></header>
  <main>
    <h1>Planes de estudio</h1>
    <p class="ayuda">Consultá los planesde estudio, sus materias, correlatividades y condiciones de aprobación/acreditación.</p>
    <fieldset id="filtros" disabled>
      <legend>Buscar resoluciones</legend>
      <div class="filtros">
        <label for="facultad">Facultad<select id="facultad"><option value="">Todas las facultades</option></select></label>
        <label for="nombre-corto">Carrera<select id="nombre-corto"><option value="">Todas las carreras</option></select></label>
        <label for="resolucion">Resolución<select id="resolucion"><option value="">Todas las resoluciones</option></select></label>
      </div>
    </fieldset>
    <p id="estado" role="status" aria-live="polite" hidden>Cargando resoluciones…</p>
    <button id="reintentar" type="button" hidden>Reintentar</button>
    <section id="resultados" aria-label="Resoluciones"></section>
    <div hidden><button id="imprimir" class="boton-secundario" type="button" disabled>Imprimir / Guardar PDF</button></div>
  </main>
  <div id="impresion" aria-hidden="true"></div>
  <script>
    'use strict';
    const ui = Object.fromEntries(['filtros', 'facultad', 'nombre-corto', 'resolucion', 'estado', 'reintentar', 'resultados', 'imprimir', 'impresion'].map(id => [id, document.getElementById(id)]));
    const comparar = new Intl.Collator('es', { numeric: true, sensitivity: 'base' });
    const etiquetasCorrelativas = {
      reg_cursar: { codigo: 'RC', descripcion: 'Regularizada para cursar' },
      apr_rendir: { codigo: 'AR', descripcion: 'Aprobada para rendir' },
      apr_cursar: { codigo: 'AC', descripcion: 'Aprobada para cursar' },
      reg_rendir: { codigo: 'RR', descripcion: 'Regularizada para rendir' }
    };
    let datos;
    let materiasPorId;
    const nombreCorto = carrera => String(carrera.nombre_corto || carrera.nombre || 'No informado').trim();
    const facultadCarrera = carrera => String(carrera.facultad || 'No informada').trim();
    const claveNombreCorto = carrera => nombreCorto(carrera).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLocaleLowerCase('es');
    const coincideFacultad = carrera => !ui.facultad.value || facultadCarrera(carrera) === ui.facultad.value;
    const coincideNombreCorto = carrera => !ui['nombre-corto'].value || claveNombreCorto(carrera) === ui['nombre-corto'].value;
    function texto(tag, valor, clase) {
      const elemento = document.createElement(tag);
      elemento.textContent = valor;
      if (clase) elemento.className = clase;
      return elemento;
    }
    // Solo se ofrecen documentos publicados en este proyecto o mediante HTTPS.
    function urlPDF(ruta) {
      if (typeof ruta !== 'string' || !ruta.trim()) return null;
      const valor = ruta.trim();
      if (/^[^\\/]+\.pdf$/i.test(valor)) return new URL('./pdf%20resoluciones/' + encodeURIComponent(valor), location.href).href;
      if (valor.startsWith('https://')) {
        try { return new URL(valor).href; } catch { return null; }
      }
      if (!/^(?:\.\/)?pdfs\/[\w\- /%.]+\.pdf$/i.test(valor) || valor.includes('..')) return null;
      return new URL(valor, location.href).href;
    }
    function agregarDato(lista, etiqueta, valor) {
      const grupo = document.createElement('div');
      grupo.append(texto('dt', etiqueta), texto('dd', valor || 'No informado'));
      lista.append(grupo);
    }
    function tablaMaterias(materias, idAclaracion) {
      materiasPorId = new Map(materias.map(m => [String(m.id), m]));
      const contenedor = texto('div', '', 'tabla');
      contenedor.tabIndex = 0;
      contenedor.setAttribute('role', 'region');
      contenedor.setAttribute('aria-label', 'Materias por año');
      const tabla = document.createElement('table');
      tabla.append(texto('caption', 'Materias por año'));
      const cabecera = document.createElement('thead');
      const fila = document.createElement('tr');
      ['Materia', 'Modalidad', 'Horas totales', 'Correlativas', 'Nota mínima de cursada', 'Asistencia', 'Acreditación'].forEach(nombre => {
        const celda = texto('th', nombre); celda.scope = 'col';
        if (nombre === 'Correlativas') {
          const enlace = texto('a', '*');
          enlace.href = `#${idAclaracion}`;
          enlace.setAttribute('aria-label', 'Ver aclaración de las correlativas al final');
          celda.append(document.createTextNode(' '), enlace);
        }
        fila.append(celda);
      });
      cabecera.append(fila); tabla.append(cabecera);
      const cuerpo = document.createElement('tbody');
      let ultimoAnio;
      [...materias].sort((a, b) => comparar.compare(String(a.anio || 'z'), String(b.anio || 'z')) || (a.numero_orden ?? Infinity) - (b.numero_orden ?? Infinity) || comparar.compare(a.nombre, b.nombre)).forEach(materia => {
        const anio = materia.anio ? `${materia.anio}° año` : 'Año no informado';
        if (anio !== ultimoAnio) {
          const separador = texto('tr', '', 'separador-anio');
          const titulo = texto('th', anio);
          titulo.colSpan = 7;
          titulo.scope = 'rowgroup';
          separador.append(titulo);
          cuerpo.append(separador);
          ultimoAnio = anio;
        }
        const filaMateria = document.createElement('tr');
        const nombre = texto('td', materia.nombre);
        if (materia.activa === false) nombre.append(texto('p', 'Inactiva', 'muted'));
        const periodicidad = { '1c': '1C', '2c': '2C' }[materia.periodicidad] || datos.catalogos?.periodicidad?.[materia.periodicidad] || materia.periodicidad || 'No informada';
        const promocion = materia.promocion_directa === true ? 'Promoción directa' : materia.promocion_directa === false ? 'Con examen final' : 'Definición institucional';
        const celdaPromocion = texto('td', promocion, materia.promocion_directa == null ? 'dato-pendiente' : '');
        filaMateria.append(
          nombre,
          texto('td', periodicidad),
          texto('td', materia.horas_totales ?? '—'),
          texto('td', materia.nota_aprobacion_cursada ?? '—'),
          texto('td', materia.asistencia_minima_porcentaje == null ? '—' : `${materia.asistencia_minima_porcentaje}%`),
          celdaPromocion
        );
        const correlativas = document.createElement('td');
        if (materia.correlatividades?.length) {
          const lista = texto('ul', '', 'correlativas');
          const requisitos = new Map();
          materia.correlatividades.forEach(correlativa => {
            const id = correlativa.materia_requerida_id == null ? `nombre:${correlativa.materia_requerida_nombre || 'No informada'}` : String(correlativa.materia_requerida_id);
            if (!requisitos.has(id)) requisitos.set(id, new Set());
            requisitos.get(id).add(correlativa.tipo);
          });
          requisitos.forEach((tipos, id) => {
            const requerida = materiasPorId.get(id);
            const item = texto('li', requerida?.nombre || (id.startsWith('nombre:') ? `${id.slice(7)} (fuera de esta variante)` : 'Materia no informada'));
            [...tipos].sort((a, b) => Object.keys(etiquetasCorrelativas).indexOf(a) - Object.keys(etiquetasCorrelativas).indexOf(b)).forEach(tipo => {
              const etiqueta = etiquetasCorrelativas[tipo] || { codigo: tipo, descripcion: datos.catalogos?.tipo_correlatividad?.[tipo] || tipo };
              const badge = texto('span', etiqueta.codigo, 'tipo-correlativa');
              badge.title = etiqueta.descripcion;
              badge.setAttribute('aria-label', etiqueta.descripcion);
              item.append(badge);
            });
            lista.append(item);
          });
          correlativas.append(lista);
        }
        filaMateria.insertBefore(correlativas, filaMateria.children[3]); cuerpo.append(filaMateria);
      });
      tabla.append(cuerpo); contenedor.append(tabla); return contenedor;
    }
    function tarjeta(carrera, resolucion) {
      const articulo = document.createElement('article');
      const informacion = texto('div', '', 'informacion-resolucion');
      const encabezado = texto('div', '', 'encabezado-resolucion');
      const carreraNombre = texto('div', resolucion.nombre + (resolucion.variante ? ` · ${resolucion.variante}` : ''), 'nombre-carrera');
      encabezado.append(carreraNombre);
      const titulo = texto('div', '', 'titulo-otorgado');
      titulo.append(texto('strong', 'Título: '), texto('span', resolucion.titulo_otorgado || 'No informado'));
      encabezado.append(titulo);
      const metadatos = texto('div', '', 'metadatos-resolucion');
      const numero = texto('div', '', 'resolucion-inline');
      numero.append(texto('span', `Res: ${resolucion.numero_resolucion}/${String(resolucion.anio_resolucion).slice(-2)}`));
      const fuente = datos.fuentes?.find(f => String(f.id) === String(resolucion.fuente_id ?? carrera.fuente_id));
      const pdf = urlPDF(resolucion.pdf || fuente?.archivo);
      if (pdf) {
        const enlace = texto('a', '', 'pdf-icono');
        enlace.href = pdf; enlace.target = '_blank'; enlace.rel = 'noopener noreferrer';
        enlace.title = 'Ver PDF de la resolución';
        enlace.setAttribute('aria-label', 'Ver PDF de la resolución');
        enlace.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>';
        numero.append(enlace);
      }
      metadatos.append(numero);
      encabezado.append(metadatos);
      const accionesEstado = texto('div', '', 'acciones-estado');
      accionesEstado.append(
        texto('span', resolucion.activo === true ? 'Activa' : resolucion.activo === false ? 'Inactiva' : 'Estado no informado', resolucion.activo ? 'etiqueta estado-resolucion' : 'etiqueta inactiva estado-resolucion'),
        ui.imprimir
      );
      const detalle = texto('div', '', 'detalle-resolucion');
      detalle.append(encabezado, texto('p', 'Duración: ' + (carrera.duracion_anios ?? 'No informada') + ' años · Horas totales: ' + (resolucion.horas_totales ?? 'No informadas'), 'resumen-plan'));
      informacion.append(detalle, accionesEstado);
      articulo.append(informacion);
      if (fuente) {
        const detalleFuente = texto('details', '', 'comentarios-resolucion');
        detalleFuente.hidden = true;
        detalleFuente.append(texto('summary', 'Fuente, notas de extracción e inconsistencias'));
        detalleFuente.append(texto('p', fuente.archivo));
        if (fuente.paginas_pdf?.length) detalleFuente.append(texto('p', 'Páginas PDF: ' + fuente.paginas_pdf.join(', ')));
        const notas = document.createElement('ul');
        (fuente.notas_extraccion || []).forEach(n => notas.append(texto('li', typeof n === 'string' ? n : JSON.stringify(n))));
        detalleFuente.append(notas);
        (fuente.inconsistencias || []).forEach(n => detalleFuente.append(texto('p', typeof n === 'string' ? n : JSON.stringify(n, null, 2))));
        articulo.append(detalleFuente);
      }
      if (typeof resolucion.comentarios === 'string' && resolucion.comentarios.trim()) {
        const comentarios = texto('details', '', 'comentarios-resolucion');
        comentarios.append(texto('summary', 'Comentarios sobre la resolución'), texto('p', resolucion.comentarios));
        articulo.append(comentarios);
      }
      const materias = resolucion.materias || [];
      if (!materias.length) articulo.append(texto('p', 'Materias aún no cargadas.', 'muted'));
      else {
        const detalle = texto('div', '', 'materias-plan');
          const idAclaracion = `aclaracion-correlativas-${resolucion.id}`;
          detalle.append(tablaMaterias(materias, idAclaracion));
          const aclaracion = texto('div', '', 'aclaracion-correlativas');
          aclaracion.id = idAclaracion;
          const cursar = document.createElement('p');
          cursar.append(texto('strong', 'RC -> Regularizada para cursar: '), document.createTextNode('tenés que aprobar la '), texto('strong', 'cursada'), document.createTextNode(' de la materia indicada como requisito para poder '), texto('strong', 'cursar'), document.createTextNode(' la materia que la requiere.'));
          const rendir = document.createElement('p');
          rendir.append(texto('strong', 'AR -> Aprobada para rendir: '), document.createTextNode('tenés que aprobar el '), texto('strong', 'final'), document.createTextNode(' de la materia indicada como requisito para poder rendir el '), texto('strong', 'final'), document.createTextNode(' de la materia que la requiere.'));
          aclaracion.append(cursar, rendir);
          detalle.append(aclaracion);
        articulo.append(detalle);
      }
      return articulo;
    }
    function actualizarCarreras() {
      const seleccion = ui['nombre-corto'].value;
      ui['nombre-corto'].replaceChildren(new Option('Todas las carreras', ''));
      const nombres = new Map();
      datos.carreras.filter(coincideFacultad).forEach(carrera => {
        const clave = claveNombreCorto(carrera);
        if (!nombres.has(clave)) nombres.set(clave, nombreCorto(carrera));
      });
      [...nombres].sort((a, b) => comparar.compare(a[1], b[1])).forEach(([clave, nombre]) => ui['nombre-corto'].add(new Option(nombre, clave)));
      ui['nombre-corto'].value = nombres.has(seleccion) ? seleccion : '';
    }
    function actualizarResoluciones() {
      const seleccion = ui.resolucion.value;
      ui.resolucion.replaceChildren(new Option('Todas las resoluciones', ''));
      const opciones = datos.carreras.filter(c => coincideFacultad(c) && coincideNombreCorto(c))
        .flatMap(c => c.resoluciones.map(r => ({ carrera: c, resolucion: r })))
        .sort((a, b) => b.resolucion.anio_resolucion - a.resolucion.anio_resolucion || comparar.compare(a.resolucion.codigo, b.resolucion.codigo));
      opciones.forEach(({ carrera, resolucion }) => {
        const etiqueta = `${resolucion.numero_resolucion}/${resolucion.anio_resolucion}${resolucion.variante ? ` · ${resolucion.variante}` : ''}${ui['nombre-corto'].value ? '' : ` · ${nombreCorto(carrera)}`}`;
        ui.resolucion.add(new Option(etiqueta, String(resolucion.id)));
      });
      ui.resolucion.value = opciones.some(({ resolucion }) => String(resolucion.id) === seleccion) ? seleccion : '';
    }
    function renderizar() {
      ui.resultados.replaceChildren();
      ui.imprimir.disabled = true;
      ui.impresion.replaceChildren();
      if (!ui.resolucion.value) {
        ui.estado.textContent = 'Seleccioná una resolución para consultar sus materias. Podés elegir primero una carrera para acotar la lista.';
        return;
      }
      let cantidad = 0;
      const carreras = datos.carreras.filter(c => coincideFacultad(c) && coincideNombreCorto(c)).sort((a, b) => comparar.compare(nombreCorto(a), nombreCorto(b)));
      carreras.forEach(carrera => {
        [...carrera.resoluciones].sort((a, b) => b.anio_resolucion - a.anio_resolucion || comparar.compare(a.codigo, b.codigo)).forEach(resolucion => {
          if (ui.resolucion.value && String(resolucion.id) !== ui.resolucion.value) return;
          ui.resultados.append(tarjeta(carrera, resolucion)); cantidad++;
        });
      });
      ui.estado.textContent = cantidad ? `${cantidad} ${cantidad === 1 ? 'resolución encontrada' : 'resoluciones encontradas'}.` : 'No hay resoluciones para los filtros seleccionados.';
      ui.imprimir.disabled = cantidad !== 1;
    }
    function inicializar() {
        if (!Array.isArray(datos.carreras) || datos.carreras.some(c => !Array.isArray(c.resoluciones))) throw new Error('Formato inválido');
        materiasPorId = new Map(datos.carreras.flatMap(c => c.resoluciones.flatMap(r => r.materias || [])).map(m => [String(m.id), m]));
        ui.facultad.replaceChildren(new Option('Todas las facultades', ''));
        [...new Set(datos.carreras.map(facultadCarrera))].sort(comparar.compare).forEach(nombre => ui.facultad.add(new Option(nombre, nombre)));
        actualizarCarreras();
        actualizarResoluciones(); renderizar(); ui.filtros.disabled = false;
    }
    async function cargar() {
      ui.filtros.disabled = true; ui.imprimir.disabled = true; ui.reintentar.hidden = true; ui.estado.textContent = 'Cargando resoluciones…';
      try {
        const respuesta = await fetch('./planes_estudio_extraidos.json', { cache: 'no-cache' });
        if (!respuesta.ok) throw new Error('No se pudo cargar el archivo');
        datos = await respuesta.json();
        inicializar();
      } catch {
        ui.resultados.replaceChildren(); ui.estado.textContent = 'No se pudo cargar el JSON automáticamente.'; ui.reintentar.hidden = false;
      }
    }
    ui['nombre-corto'].addEventListener('change', () => { actualizarResoluciones(); renderizar(); });
    ui.facultad.addEventListener('change', () => { actualizarCarreras(); actualizarResoluciones(); renderizar(); });
    ui.resolucion.addEventListener('change', renderizar);
    ui.reintentar.addEventListener('click', cargar);
    function prepararImpresion() {
      ui.impresion.replaceChildren();
      ui.impresion.style.zoom = '1';
      const articulo = ui.resultados.querySelector('article');
      if (!articulo || ui.imprimir.disabled) return;
      const logo = document.querySelector('header .logo').cloneNode(true);
      const copia = articulo.cloneNode(true);
      copia.querySelectorAll('.comentarios-resolucion').forEach(comentarios => { comentarios.open = true; });
      ui.impresion.append(logo, copia);
      // Medir en el mismo ancho A4 que se usará al imprimir, con márgenes de 10 mm.
      const regla = document.createElement('div');
      regla.style.height = '277mm';
      ui.impresion.append(regla);
      const altoDisponible = regla.getBoundingClientRect().height;
      regla.remove();
      const altoContenido = ui.impresion.scrollHeight;
      ui.impresion.style.zoom = String(Math.min(1, (altoDisponible - 4) / Math.max(1, altoContenido)));
    }
    ui.imprimir.addEventListener('click', () => {
      if (!ui.imprimir.disabled) window.print();
    });
    window.addEventListener('beforeprint', prepararImpresion);
    window.addEventListener('afterprint', () => ui.impresion.replaceChildren());
    cargar();
  </script>
</body>
</html>
